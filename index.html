<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Умный бот</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: linear-gradient(135deg, #1e1b4b, #312e81);
    min-height: 100vh; display: flex; justify-content: center; align-items: center;
    padding: 20px;
  }
  .chat {
    width: 100%; max-width: 480px; height: 640px;
    background: #0f172a; border-radius: 16px;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.5); overflow: hidden;
  }
  .header {
    padding: 16px; background: #1e293b; color: #fff;
    font-weight: 600; border-bottom: 1px solid #334155;
  }
  .header small { color: #94a3b8; font-weight: 400; font-size: 12px; display: block; margin-top: 2px; }
  .messages {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; font-size: 14px; color: #e2e8f0;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .user { align-self: flex-end; background: #6366f1; color: #fff; border-bottom-right-radius: 4px; }
  .bot  { align-self: flex-start; background: #1e293b; border-bottom-left-radius: 4px; }
  .input-row { display: flex; padding: 12px; gap: 8px; background: #1e293b; }
  input {
    flex: 1; padding: 10px 14px; border-radius: 10px; border: none; outline: none;
    background: #0f172a; color: #e2e8f0; font-size: 14px;
  }
  button {
    padding: 10px 16px; border: none; border-radius: 10px;
    background: #6366f1; color: #fff; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="chat">
  <div class="header">Умный бот <small>powered by AI</small></div>
  <div class="messages" id="messages">
    <div class="msg bot">Привет! Чем могу помочь?</div>
  </div>
  <div class="input-row">
    <input id="input" placeholder="Напиши сообщение..." autocomplete="off">
    <button id="send">➤</button>
  </div>
</div>

<script>
// ==== НАСТРОЙКА ====
// Вставь свой API-ключ (OpenAI / DeepSeek / другой совместимый)
const API_KEY = "ВСТАВЬ_СВОЙ_КЛЮЧ";
const API_URL = "https://api.openai.com/v1/chat/completions"; // для DeepSeek: https://api.deepseek.com/v1/chat/completions
const MODEL   = "gpt-4o-mini";                               // для DeepSeek: "deepseek-chat"

const history = [
  { role: "system", content: "Ты очень умный, дружелюбный помощник. Отвечай кратко и по делу." }
];

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  addMessage(text, "user");
  history.push({ role: "user", content: text });
  inputEl.value = "";
  sendBtn.disabled = true;

  const botEl = addMessage("…", "bot");

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + API_KEY
      },
      body: JSON.stringify({ model: MODEL, messages: history })
    });
    const data = await res.json();
    const answer = data.choices?.[0]?.message?.content || "Ошибка ответа";
    botEl.textContent = answer;
    history.push({ role: "assistant", content: answer });
  } catch (e) {
    botEl.textContent = "Ошибка: " + e.message;
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.onclick = sendMessage;
inputEl.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
</script>
</body>
</html>
