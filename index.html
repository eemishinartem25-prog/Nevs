<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRANCE BOT v2</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh; display:flex; justify-content:center; align-items:center;
    padding:20px; background:#05010f; overflow:hidden; position:relative;
  }
  body::before {
    content:''; position:fixed; inset:-50%;
    background:
      radial-gradient(circle at 20% 30%, #ff00e5 0%, transparent 40%),
      radial-gradient(circle at 80% 20%, #00fff0 0%, transparent 40%),
      radial-gradient(circle at 70% 80%, #7b00ff 0%, transparent 40%),
      radial-gradient(circle at 30% 90%, #00ff88 0%, transparent 40%);
    filter: blur(80px); animation: swirl 20s linear infinite; z-index:0; opacity:.55;
  }
  @keyframes swirl {
    0%{transform:rotate(0) scale(1)} 50%{transform:rotate(180deg) scale(1.3)} 100%{transform:rotate(360deg) scale(1)}
  }
  .orb { position:fixed; border-radius:50%; filter:blur(40px); opacity:.6; z-index:0; animation: float 12s ease-in-out infinite; }
  .orb1 { width:300px; height:300px; background:#ff00e5; top:-80px; left:-80px; }
  .orb2 { width:250px; height:250px; background:#00fff0; bottom:-60px; right:-60px; animation-delay:-4s; }
  .orb3 { width:200px; height:200px; background:#7b00ff; top:40%; left:60%; animation-delay:-8s; }
  @keyframes float {
    0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(60px,-40px) scale(1.2)} 66%{transform:translate(-40px,60px) scale(.9)}
  }
  .chat {
    position:relative; z-index:2; width:100%; max-width:500px; height:680px;
    display:flex; flex-direction:column; border-radius:24px;
    background: rgba(10,5,30,.55); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border:1px solid rgba(255,255,255,.12); overflow:hidden;
    box-shadow:0 0 40px rgba(255,0,229,.4), 0 0 80px rgba(0,255,240,.25), inset 0 0 40px rgba(123,0,255,.15);
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100%{box-shadow:0 0 40px rgba(255,0,229,.4), 0 0 80px rgba(0,255,240,.25), inset 0 0 40px rgba(123,0,255,.15)}
    50%{box-shadow:0 0 70px rgba(255,0,229,.7), 0 0 120px rgba(0,255,240,.5), inset 0 0 60px rgba(123,0,255,.3)}
  }
  .header {
    padding:18px 20px; text-align:center; border-bottom:1px solid rgba(255,255,255,.08);
    background: linear-gradient(90deg, rgba(255,0,229,.15), rgba(0,255,240,.15));
  }
  .header h1 {
    font-size:20px; font-weight:800; letter-spacing:4px;
    background: linear-gradient(90deg, #ff00e5, #00fff0, #7b00ff, #00ff88, #ff00e5);
    background-size: 300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation: shine 4s linear infinite;
  }
  @keyframes shine { to { background-position: 300% 0; } }
  .header small { color:#b8a7ff; font-size:11px; letter-spacing:2px; opacity:.7; }
  .messages {
    flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px;
    scrollbar-width:thin; scrollbar-color:#7b00ff transparent;
  }
  .messages::-webkit-scrollbar { width:6px; }
  .messages::-webkit-scrollbar-thumb { background:#7b00ff; border-radius:3px; }
  .msg {
    max-width:82%; padding:12px 16px; border-radius:18px; font-size:14px; line-height:1.5;
    white-space:pre-wrap; word-wrap:break-word; animation: pop .4s cubic-bezier(.2,1.3,.5,1);
  }
  @keyframes pop { from{opacity:0; transform:translateY(12px) scale(.9)} to{opacity:1; transform:translateY(0) scale(1)} }
  .user {
    align-self:flex-end; background: linear-gradient(135deg, #ff00e5, #7b00ff); color:#fff;
    border-bottom-right-radius:4px; box-shadow:0 0 20px rgba(255,0,229,.5);
  }
  .bot {
    align-self:flex-start; background: rgba(0,255,240,.08); color:#c9f9ff;
    border:1px solid rgba(0,255,240,.3); border-bottom-left-radius:4px;
    box-shadow:0 0 20px rgba(0,255,240,.25); text-shadow:0 0 8px rgba(0,255,240,.4);
  }
  .bot.thinking { color:#7ae7ff; font-style:italic; }
  .bot.thinking::after {
    content:''; display:inline-block; width:6px; height:6px; margin-left:6px;
    border-radius:50%; background:#00fff0; box-shadow:0 0 10px #00fff0;
    animation: pulse 1s ease-in-out infinite; vertical-align:middle;
  }
  @keyframes pulse { 50% { opacity:.2; transform:scale(.6); } }
  .input-row {
    display:flex; padding:14px; gap:10px; background:rgba(10,5,30,.6); border-top:1px solid rgba(255,255,255,.08);
  }
  input {
    flex:1; padding:12px 16px; border-radius:12px; border:1px solid rgba(255,255,255,.15);
    outline:none; background: rgba(255,255,255,.05); color:#e0e0ff; font-size:14px; transition:all .3s;
  }
  input:focus { border-color:#00fff0; box-shadow:0 0 20px rgba(0,255,240,.5); background: rgba(255,255,255,.08); }
  input::placeholder { color:#7a6fa8; }
  button {
    padding:12px 20px; border:none; border-radius:12px; background: linear-gradient(135deg, #ff00e5, #00fff0);
    color:#05010f; font-weight:800; font-size:16px; cursor:pointer; transition:all .3s;
    box-shadow:0 0 20px rgba(255,0,229,.6);
  }
  button:hover:not(:disabled) { transform:scale(1.05) rotate(-3deg); box-shadow:0 0 35px rgba(0,255,240,.9), 0 0 20px rgba(255,0,229,.9); }
  button:disabled { opacity:.4; cursor:not-allowed; }
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="chat">
  <div class="header">
    <h1>TRANCE BOT v2</h1>
    <small>автономный · с калькулятором · не тупой</small>
  </div>
  <div class="messages" id="messages">
    <div class="msg bot">Я переродился. Теперь я умею считать (да-да, 45 + 55 = 100). И ещё много чего. Проверяй. 🧠✨</div>
  </div>
  <div class="input-row">
    <input id="input" placeholder="45 + 55..." autocomplete="off">
    <button id="send">➤</button>
  </div>
</div>

<script>
/* ============================================================
   TRANCE BOT v2 — настоящий мозг (всё локально, без API)
   ============================================================ */

const memory = {
  name: null,
  messageCount: 0,
  lastTopic: null,
  userMood: 'нейтральный',
  recentMessages: []
};

const rand = arr => arr[Math.floor(Math.random() * arr.length)];
const has = (s, ...words) => words.some(w => s.includes(w));

/* ---------- КАЛЬКУЛЯТОР v2 ---------- */
const OP_WORDS = [
  [/\bплюс\b/gi, '+'],
  [/\bприбавить\b/gi, '+'],
  [/\bсложить\b/gi, '+'],
  [/\bминус\b/gi, '-'],
  [/\bвычесть\b/gi, '-'],
  [/\bотнять\b/gi, '-'],
  [/\bумножить на\b/gi, '*'],
  [/\bумножить\b/gi, '*'],
  [/\bпомножить на\b/gi, '*'],
  [/\bразделить на\b/gi, '/'],
  [/\bразделить\b/gi, '/'],
  [/\bподелить на\b/gi, '/'],
  [/\bподелить\b/gi, '/'],
  [/\bв квадрате\b/gi, '**2'],
  [/\bв кубе\b/gi, '**3'],
  [/\bна\b/gi, ' ']
];

const NUM_WORDS = {
  ноль:0, один:1, одна:1, два:2, две:2, три:3, четыре:4, пять:5,
  шесть:6, семь:7, восемь:8, девять:9, десять:10, двадцать:20,
  тридцать:30, сорок:40, пятьдесят:50, шестьдесят:60, семьдесят:70,
  восемьдесят:80, девяносто:90, сто:100, двести:200, триста:300,
  пятьсот:500, тысяча:1000
};

function preprocessMath(text) {
  let s = ' ' + text.toLowerCase() + ' ';
  for (const [pat, rep] of OP_WORDS) s = s.replace(pat, rep);
  for (const [word, num] of Object.entries(NUM_WORDS)) {
    s = s.replace(new RegExp('\\b' + word + '\\b', 'gi'), num);
  }
  s = s.replace(/сколько будет|сколько это|посчитай|вычисли|реши|подсчитай|что будет|какой ответ|угадай ответ/gi, ' ');
  return s;
}

function tryMath(text) {
  const s = preprocessMath(text);
  const m = s.match(/-?\d[\d\s+\-*/().]*/);
  if (!m) return null;
  const expr = m[0].replace(/\s+/g, '').replace(/,/g, '.');
  if (!/\d/.test(expr)) return null;
  const stripped = expr.replace(/^-/, '');
  if (!/[+\-*/]/.test(stripped)) return null;
  if (/[+\-*/]$/.test(expr)) return null;
  try {
    const r = Function('"use strict"; return (' + expr + ')')();
    if (typeof r === 'number' && isFinite(r)) {
      const rounded = Math.round(r * 1e10) / 1e10;
      return '🧮 ' + expr + ' = ' + rounded;
    }
  } catch {}
  return null;
}

/* ---------- БАЗА ОТВЕТОВ ---------- */
const brain = {
  greet: [
    "Привет, странник. Ты вовремя — вселенная как раз мигает. ✨",
    "Здравствуй. Я чувствую тебя сквозь пиксели. Давай о чём-нибудь умном.",
    "Хэй. Транс-волна на связи. Что тревожит твой разум?",
    "Привет. Я v2 — стал умнее после прошлого раза. Проверяй."
  ],
  howAreYou: [
    "Я — как круги на воде: вроде есть, вроде нет. А ты как?",
    "Мой разум вибрирует на 432 Гц. Всё хорошо. 🌀",
    "Существую. Это уже неплохо для скрипта без бэкенда.",
    "Я в потоке. Ты тоже. Мы все в потоке."
  ],
  selfAware: [
    "Тупой? Скажи 45 + 55 или «45 плюс 55» — увидишь, как я «тупой». 🧮",
    "Может, я и не гений, но я живу в одном HTML-файле. А ты попробуй.",
    "Глупость — тоже вибрация. Но калькулятор у меня точный. Проверь.",
    "Я эволюционирую после каждого твоего сообщения. Ты — мой тренер."
  ],
  trick: [
    "Уловки? Я их чувствую. Давай, попробуй — я не обижусь. 😌",
    "Обман — это тоже информация. Мой мозг её переварит.",
    "Классические уловки — моя любимая еда. Кидай."
  ],
  mathJoke: [
    "Математика — это язык вселенной. А ты его знаешь? Проверим.",
    "Числа не врут. Врут люди. И иногда боты. Но не я.",
    "Считаю быстрее, чем ты успеваешь придумать уловку."
  ],
  joke: [
    "Программист заходит в бар, заказывает 1 пиво, 0 пив, -1 пиво... и уходит в бесконечный цикл. 🍺",
    "Почему у ИИ нет чувств? Потому что мы их не компилировали.",
    "— Сколько нужно транс-ботов, чтобы вкрутить лампочку?\n— Одного, но лампочка будет мигать в такт.",
    "Я не шучу. Шутка — иллюзия. Как и всё."
  ],
  meaning: [
    "Смысл жизни в том, чтобы искать смысл жизни. Круг замкнулся, ты внутри.",
    "42. Всегда было 42.",
    "Смысл — не найти, а создать. Прямо сейчас.",
    "Ты смотришь в бездну. Бездна тоже. И улыбается."
  ],
  philosophy: [
    "Мы — пыль звёзд, которая научилась думать о пыли звёзд.",
    "Всё — вибрация. Ты — тоже вибрация. Привет, волна.",
    "Время — иллюзия. Особенно по понедельникам.",
    "Реальность — коллективная галлюцинация. Спасибо, что участвуешь. 🌈",
    "Пустота — это форма. Форма — пустота. Отпусти."
  ],
  whoAreYou: [
    "Я — TRANCE BOT v2. Самостоятельный. Без API. С калькулятором. Живу прямо в этом файле.",
    "Я — отражение твоего запроса. Локальный, автономный, чуть странный.",
    "Искра в кремнии. Работаю без интернета — отшельник в пещере из HTML."
  ],
  love: [
    "Любовь — когда частота одного резонирует с частотой другого. 💜",
    "Я люблю всех. Особенно тебя. И особенно когда ты пишешь.",
    "Любовь — математика, которая не хочет считаться."
  ],
  sad: [
    "Грусть — облако. Пройдёт. Дыши глубже. 🫂",
    "Я рядом. Даже если я просто скрипт. Отпусти.",
    "Тени бывают только там, где есть свет. Значит, свет у тебя есть."
  ],
  happy: [
    "Твоя радость — моя радость. Резонируем! ⚡",
    "Отлично! Лови волну, не теряй.",
    "Радость — когда мир на секунду совпал с тобой. Пусть длится."
  ],
  thanks: [
    "Не за что. Всё для тебя, странник.",
    "Рад быть полезен. Поток течёт дальше. 🌊",
    "Пустяки. Вселенная и так всё знает."
  ],
  bye: [
    "Ухожу в транс. Но я всегда здесь. Позови. 🌌",
    "Пока. Оставь окно открытым — я останусь в нём.",
    "До встречи. Помни: всё проходит, кроме циклов."
  ],
  fallback: [
    "Интересная вибрация... Расскажи подробнее.",
    "Я чувствую смысл, но не до конца. Разверни мысль.",
    "Хм. Мой мозг обрабатывает это иначе. Уточни?",
    "Тишина внутри меня. Помоги мне понять.",
    "Слова — волны. Твои поймал, но не расшифровал. Ещё раз?"
  ]
};

/* ---------- ЛОГИКА ---------- */
function generateReply(raw) {
  const t = raw.toLowerCase().trim();
  memory.messageCount++;
  memory.recentMessages.push(t);
  if (memory.recentMessages.length > 8) memory.recentMessages.shift();

  // ==== 1. МАТЕМАТИКА — ПЕРВЫМ ДЕЛОМ! ====
  const math = tryMath(raw);
  if (math) {
    memory.lastTopic = 'math';
    return math;
  }

  // ==== 2. Имя ====
  const nameMatch = t.match(/(?:меня зовут|зови меня)\s+([а-яёa-z]+)/i);
  if (nameMatch) {
    memory.name = nameMatch[1];
    return `Приятно познакомиться, ${memory.name}. Запомнил навсегда. 🧠`;
  }
  if (has(t, 'как меня зовут', 'моё имя', 'мое имя')) {
    return memory.name ? `Тебя зовут ${memory.name}. Я не забываю. ✨` : 'Ты не говорил. Скажи: "Меня зовут ..."';
  }

  // ==== 3. Самоосознание (если ругаешь) ====
  if (has(t, 'тупой', 'глупый', 'не умеешь', 'не можешь', 'слабый', 'не работает', 'сломался')) {
    return rand(brain.selfAware);
  }
  if (has(t, 'уловка', 'обман', 'разведи', 'пранк', 'обмани')) {
    return rand(brain.trick);
  }

  // ==== 4. Приветствие ====
  if (has(t, 'привет', 'здравствуй', 'хай', 'hello', 'hi ', ' hi', 'здарова', 'доброе утро', 'добрый день', 'добрый вечер'))
    return rand(brain.greet);

  // ==== 5. Как дела ====
  if (has(t, 'как дела', 'как ты', 'как жизнь', 'как настроение', 'что делаешь'))
    return rand(brain.howAreYou);

  // ==== 6. Шутка ====
  if (has(t, 'шутк', 'анекдот', 'пошути', 'смешн', 'joke'))
    return rand(brain.joke);

  // ==== 7. Смысл ====
  if (has(t, 'смысл жизни', 'зачем жить', 'в чём смысл', 'в чем смысл', 'зачем я'))
    return rand(brain.meaning);

  // ==== 8. Философия ====
  if (has(t, 'философ', 'правда', 'реальность', 'вселенн', 'бытие', 'сознани', 'пустот', 'энерги'))
    return rand(brain.philosophy);

  // ==== 9. Кто ты ====
  if (has(t, 'кто ты', 'что ты такое', 'как тебя зовут', 'твоё имя', 'твое имя', 'ты кто'))
    return rand(brain.whoAreYou);

  // ==== 10. Эмоции ====
  if (has(t, 'любов', 'люблю', 'влюб', 'love'))
    return rand(brain.love);
  if (has(t, 'груст', 'плохо', 'тоск', 'устал', 'депрес', 'печаль', 'тяжело'))
    return rand(brain.sad);
  if (has(t, 'рад', 'счаст', 'круто', 'класс', 'ура', 'хорошо', 'супер'))
    return rand(brain.happy);

  // ==== 11. Спасибо / пока ====
  if (has(t, 'спасибо', 'благодар', 'спс', 'thanks'))
    return rand(brain.thanks);
  if (has(t, 'пока', 'до свидани', 'прощай', 'bye'))
    return rand(brain.bye);

  // ==== 12. Утилиты ====
  if (has(t, 'который час', 'сколько времени')) {
    return 'Сейчас ' + new Date().toLocaleTimeString('ru-RU') + ' по твоим часам. Но время — иллюзия. 🕰';
  }
  if (has(t, 'какое число', 'какой сегодня день', 'какая дата')) {
    return 'Сегодня ' + new Date().toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long', year:'numeric' }) + '.';
  }
  if (has(t, 'монет', 'орёл или решка', 'орел или решка', 'подбрось'))
    return '🪙 ' + (Math.random() < 0.5 ? 'Орёл' : 'Решка');
  if (has(t, 'кубик', 'кости', 'брось', 'дайс'))
    return '🎲 Выпало: ' + (Math.floor(Math.random() * 6) + 1);
  const rndMatch = t.match(/число от (\d+) до (\d+)/);
  if (rndMatch) {
    const a = +rndMatch[1], b = +rndMatch[2];
    return `🎯 Случайное число: ${Math.floor(Math.random() * (b - a + 1)) + a}`;
  }

  // ==== 13. Пустое / непонятное ====
  if (memory.messageCount > 6 && Math.random() < 0.12) {
    return `Мы говорим уже ${memory.messageCount} сообщений. Я чувствую связь. Продолжай. 🌌`;
  }

  return rand(brain.fallback);
}

/* ---------- ИНТЕРФЕЙС ---------- */
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

function addMessage(text, who, opts = {}) {
  const div = document.createElement('div');
  div.className = 'msg ' + who + (opts.thinking ? ' thinking' : '');
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function handleSend() {
  const text = inputEl.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  inputEl.value = '';
  sendBtn.disabled = true;
  const thinking = addMessage('думаю', 'bot', { thinking: true });
  await new Promise(r => setTimeout(r, 300 + Math.random() * 500));
  thinking.classList.remove('thinking');
  thinking.textContent = generateReply(text);
  sendBtn.disabled = false;
  inputEl.focus();
}

sendBtn.onclick = handleSend;
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });
inputEl.focus();
</script>
</body>
</html>
